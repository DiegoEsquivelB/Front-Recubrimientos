<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recupera el acceso a tu cuenta de RecubriSys">
  <title>Recuperar contraseña | Recubrimientos Diego S.A</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body class="pagina-login">
  <main class="diseno-login">
    <section class="login-marca" aria-label="Presentación del sistema">
      <div class="login-marca__content"><img class="logo-marca logo-marca--light" src="assets/img/logo.png" alt="Logo RecubriSys"></div>
    </section>
    <section class="contenedor-tarjeta-login">
      <form class="tarjeta-login" data-password-reset-request>
        <h1>Recuperar contraseña</h1>
        <p class="texto-suave">Ingresa el correo asociado a tu cuenta. Te enviaremos un enlace para crear una contraseña nueva.</p>
        <div class="grupo-formulario">
          <label for="correo-recuperacion">Correo electrónico</label>
          <div class="campo-input campo-input--icono">
            <span class="campo-input__icono" aria-hidden="true"><img src="assets/img/ico%20correo.png" alt=""></span>
            <input id="correo-recuperacion" name="email" type="email" autocomplete="email" maxlength="254" placeholder="ejemplo@correo.com" required>
          </div>
        </div>
        <button class="boton boton-principal boton-completo" type="submit">Enviar enlace</button>
        <p class="nota-formulario"><a href="login.html">Volver a iniciar sesión</a></p>
      </form>
    </section>
  </main>
  <div class="contenedor-alertas" aria-live="polite"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
