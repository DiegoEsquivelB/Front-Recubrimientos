<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acceso al sistema de recubrimientos arquitectónicos">
  <title>Iniciar sesión | Recubrimientos Diego S.A</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body class="pagina-login">
  <main class="diseno-login">
    <section class="login-marca" aria-label="Presentación del sistema">
      <div class="login-marca__content">
        <img class="logo-marca logo-marca--light" src="assets/img/logo.png" alt="Logo RecubriSys">
      </div>
    </section>

    <section class="contenedor-tarjeta-login">
      <form class="tarjeta-login" data-form data-redirect="index.html">
        <h1>Bienvenido</h1>
        <p class="texto-suave">Ingresa tus credenciales para continuar.</p>

        <div class="grupo-formulario">
          <label for="usuario">Correo electrónico o usuario <span aria-label="obligatorio">*</span></label>
          <div class="campo-input campo-input--icono">
            <span class="campo-input__icono" aria-hidden="true">
              <img src="assets/img/ico%20correo.png" alt="Correo" />
            </span>
            <input id="usuario" name="usuario" type="text" autocomplete="username" placeholder="ejemplo@correo.com" required>
          </div>
        </div>

        <div class="grupo-formulario">
          <label for="contrasena">Contraseña <span aria-label="obligatorio">*</span></label>
          <div class="campo-input campo-input--icono campo-contrasena">
            <span class="campo-input__icono" aria-hidden="true">
              <img src="assets/img/ico%20password.png" alt="Contraseña" />
            </span>
            <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" placeholder="Ingresa su contraseña" required>
            <button class="boton-icono alternar-contrasena" type="button" aria-label="Mostrar contraseña">◉</button>
          </div>
        </div>

        <div class="error-login" id="error-login" aria-live="polite" role="alert" style="display:none;"></div>

        <div class="opciones-formulario">
          <label class="etiqueta-check"><input type="checkbox" name="recordar"> Recordarme</label>
          <a href="#recuperar">¿Olvidó su contraseña?</a>
        </div>

        <button class="boton boton-principal boton-completo" type="submit">Ingresar al sistema</button>

        <p class="nota-formulario">Acceso exclusivo para usuarios autorizados.</p>
      </form>
    </section>
  </main>
  <div class="contenedor-alertas" aria-live="polite"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
