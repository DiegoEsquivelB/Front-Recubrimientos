<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Establece una contraseña nueva para RecubriSys">
  <title>Nueva contraseña | Recubrimientos Diego S.A</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body class="pagina-login">
  <main class="diseno-login">
    <section class="login-marca" aria-label="Presentación del sistema">
      <div class="login-marca__content"><img class="logo-marca logo-marca--light" src="assets/img/logo.png" alt="Logo RecubriSys"></div>
    </section>
    <section class="contenedor-tarjeta-login">
      <form class="tarjeta-login" data-password-reset-confirm>
        <h1>Nueva contraseña</h1>
        <p class="texto-suave">Elige una contraseña de al menos 8 caracteres para tu cuenta.</p>
        <div class="grupo-formulario">
          <label for="nueva-contrasena">Contraseña nueva</label>
          <div class="campo-input campo-input--icono">
            <span class="campo-input__icono" aria-hidden="true"><img src="assets/img/ico%20password.png" alt=""></span>
            <input id="nueva-contrasena" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Mínimo 8 caracteres" required>
          </div>
        </div>
        <div class="grupo-formulario">
          <label for="confirmar-contrasena">Confirmar contraseña</label>
          <div class="campo-input campo-input--icono">
            <span class="campo-input__icono" aria-hidden="true"><img src="assets/img/ico%20password.png" alt=""></span>
            <input id="confirmar-contrasena" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Repite la contraseña" required>
          </div>
        </div>
        <button class="boton boton-principal boton-completo" type="submit">Guardar contraseña</button>
        <p class="nota-formulario"><a href="login.html">Volver a iniciar sesión</a></p>
      </form>
    </section>
  </main>
  <div class="contenedor-alertas" aria-live="polite"></div>
  <script src="assets/js/app.js"></script>
</body>
</html>
